[package]
name = "magician"
version = "0.1.0"
edition = "2021"
description = "Human-like chess engine: alpha-beta search + a neural model of how strong humans (Tal, Carlsen) choose moves"
license = "MIT"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
